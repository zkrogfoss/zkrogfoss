<title id="t">zkrogfoss: agents, checks, human review, ship</title>
<desc id="d">A command sends ideas to four agents: planner, builder, tester and critic. Types, lint, unit and e2e checks pass, but the human says no: exit 1, and the work goes back. The second time both agree: it ships with exit 0.</desc>
